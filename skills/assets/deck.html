*{box-sizing:border-box} :root{--ink:#111d20;--green:#002f6d;--soft:#e4eaf1;--line:#c9d2dd;--muted:#405064}body{margin:0;background:#162021;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}button{font:inherit;cursor:pointer}#stage{width:1280px;height:720px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--scale,1));background:#fcfcfd;overflow:hidden}section{position:absolute;inset:0;display:none;padding:46px 62px 74px}section.on{display:block}h1,h2,h3,p{margin:0}h2{font-size:43px;line-height:1.35;font-weight:730;margin:13px 0 21px}h3{font-size:29px;line-height:1.42}.eyebrow,label{display:block;color:var(--green);font-weight:700;font-size:17px}.eyebrow{display:flex;align-items:center;gap:13px}.eyebrow:before{content:"";width:30px;height:3px;background:currentColor}p{font-size:24px;line-height:1.62}.intro,.caption{color:var(--muted)}.intro{font-size:23px}.caption{font-size:17px;line-height:1.55;margin-top:13px}section>small{position:absolute;left:62px;bottom:28px;font-size:15px;color:#425267;max-width:900px}a{color:var(--green)}aside{display:none}.pair{display:grid;grid-template-columns:1.24fr 1fr;gap:50px;align-items:center;min-height:425px}.textcol p,.formula p{margin-top:10px;font-size:24px}.textcol h3:not(:first-child){margin-top:23px}.taskphoto,.figure img{width:100%;display:block}.taskphoto{border-radius:3px}.val{font:750 94px/1 "Segoe UI",sans-serif;color:var(--green);margin-bottom:12px}.val span{font-size:47px;color:#495b73}.textcol .em{font-weight:650;color:var(--green);margin-top:23px}.pipeline,.noise{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:62px 0 45px}.pipeline>div,.noise>div{flex:1;border-top:3px solid var(--green);padding:19px 0}.pipeline>b,.noise>b{font-size:33px;color:#677f9e}.pipeline strong,.noise strong{display:block;font-size:39px;line-height:1.5;margin:9px 0;font-family:Cambria,"Microsoft YaHei",serif}.pipeline p,.noise p{font-size:21px;color:var(- h:100%;display:block;margin:14px auto}.twoplots p{font-size:21px}.endgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-top:42px}.conclusion{padding:35px}.conclusion h3{font-size:40px;margin:18px 0}.conclusion p{font-size:21px;color:#dfe5ed}.endgrid .textcol p{font-size:22px}
.cover{padding:0;background:#17273c}.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 54%}.veil{position:absolute;inset:0 46% 0 0;background:rgba(17,47,86,.96)}.covertext{position:relative;width:670px;padding:60px 61px;color:#fff}.cover .eyebrow{color:#b6cce9}.cover h1{font-size:104px;line-height:1.1;margin:46px 0 10px;font-weight:750}.cover h2{font-size:47px;line-height:1.35;margin:0 0 24px}.eng{font:24px/1.35 Georgia,serif;color:#d4dde8}.credit{font-size:16px;color:#c4cedb;margin-top:48px}.controls{position:absolute;right:30px;bottom:14px;display:flex;align-items:center;gap:4px;color:#354253;background:#f1f3f6;padding:3px 5px;border:1px solid #cbd3dd;border-radius:6px}.controls button,dialog button{border:0;background:transparent;color:inherit}.controls button{width:32px;height:31px;font-size:18px;border-radius:3px}.controls button:hover,.controls button:focus-visible{background:#d6dee8}.controls output{font-size:14px;min-width:49px;text-align:center;font-variant-numeric:tabular-nums}.controls button:disabled{opacity:.33}.controls svg{width:16px;height:16px;vertical-align:middle}.progress{position:absolute;left:0;bottom:0;height:4px;background:#30598f}dialog{border:1px solid #a5b3c5;background:#fcfcfd;color:var(--ink);width:min(860px,85vw);max-height:80vh;padding:25px 33px;border-radius:8px}dialog::backdrop{background:#101b2999}dialog header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:22px}dialog header button{font-size:28px}dialog p{font-size:20px;line-height:1.8}dialog ol{padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:5px}li button{width:100%;height:100%;text-align:left;padding:9px 5px}li button:hover{background:var(--soft)}

figure img.zoomable{cursor:zoom-in}figure video{background:#12161c}
figcaption{margin:7px 0 6px;font-size:15px;line-height:1.4;color:#435369}

</style><style>.cover{background:#ebeff3}.cover .veil{background:#102138}.cover .paper-front{position:absolute;right:56px;top:16px;height:640px;width:auto;max-width:490px;object-fit:contain;box-shadow:0 2px 14px #17202c1f}</style><style>
.cover .veil{background:#16375e}.cover .eyebrow{color:#bfd9f7}
section:not(.cover)>h2{color:#141b24;font-weight:700}

</style></head><body><main id="stage"><!--SLIDES-->
<div aria-label="演示工具" class="controls"><button aria-label="目录" id="menu" title="目录（G）">☰</button><button aria-label="讲稿" id="notes" title="讲稿（N）">☷</button><button aria-label="全屏" id="fs" title="全屏（F）">⛶</button><button aria-label="上一页" id="prev" title="上一页（←）">‹</button><output id="count"></output><button aria-label="下一页" id="next" title="下一页（→）">›</button></div><div class="progress"></div></main><dialog id="panel"><header><strong></strong><button aria-label="关闭" title="关闭">×</button></header><div id="detail"></div></dialog>
<script>
const $=s=>document.querySelector(s), stage=$('#stage'), pages=[...stage.querySelectorAll('section')], panel=$('#panel');let current=-1;
function fit(){stage.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720))}
const steps = pages.map(page => {
  const groups = new Map();
  for (const item of page.querySelectorAll('[data-step]')) {
    const key = item.dataset.step || item;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  }
  return Array.from(groups.values());
});
let step = 0;
function setStep(index) {
  const items = steps[current];
  step = Math.max(items.length > 1 ? -1 : 0, Math.min(index, items.length - 1));
  items.forEach((group, i) => {
    for (const item of group) {
      item.classList.toggle('step-current', items.length > 1 && i <= step);
      item.classList.toggle('step-muted', items.length > 1 && i > step);
    }
  });
  $('#count').textContent = (current + 1) + ' / ' + pages.length;
  $('#prev').disabled = current === 0 && step === (items.length > 1 ? -1 : 0);
  $('#next').disabled = current === pages.length - 1 && step >= items.length - 1;
}
function show(n, index = -1) {
  n = Math.max(0, Math.min(pages.length - 1, n));
  if (current !== n) {
    if (current >= 0) pages[current].querySelectorAll('video').forEach(v => v.pause());
    current = n;
    pages.forEach((page, i) => page.classList.toggle('on', i === n));
    pages[n].querySelectorAll('video').forEach(video => {
      video.muted = true;
      video.controls = true;
      video.playsInline = true;
      video.play().catch(() => {}); // The native play control remains available.
    });
    $('.progress').style.width = ((n + 1) / pages.length * 100) + '%';
    history.replaceState(null, '', '#' + (n + 1));
  }
  setStep(index);
}
function advance(delta) {
  const index = step + delta;
  if (steps[current].length > 1 && index >= -1 && index < steps[current].length) return setStep(index);
  const target = current + delta;
  if (target >= 0 && target < pages.length) show(target, delta < 0 ? steps[target].length - 1 : -1);
}
function fromHash(){show((parseInt(location.hash.slice(1))||1)-1)}
function dialogView(kind){$('#detail').replaceChildren();panel.querySelector('strong').textContent=kind==='notes'?'第 '+(current+1)+' 页 · 讲稿':'汇报目录';if(kind==='notes'){let p=document.createElement('p');p.textContent=pages[current].querySelector('aside').textContent;$('#detail').append(p)}else{let ol=document.createElement('ol');pages.forEach((s,i)=>{let li=document.createElement('li'),b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'　'+s.dataset.topic;b.onclick=()=>{panel.close();show(i)};li.append(b);ol.append(li)});$('#detail').append(ol)}panel.showModal()}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
$('#prev').onclick=()=>advance(-1);$('#next').onclick=()=>advance(1);$('#fs').onclick=fullscreen;$('#notes').onclick=()=>dialogView('notes');$('#menu').onclick=()=>dialogView('menu');panel.querySelector('header button').onclick=()=>panel.close();
addEventListener('keydown',e=>{if(panel.open)return;let k=e.key.toLowerCase();if(k===' '&&['VIDEO','BUTTON','A'].includes(document.activeElement.tagName))return;if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();advance(1)}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();advance(-1)}else if(k==='home')show(0);else if(k==='end')show(pages.length-1,steps[pages.length-1].length-1);else if(k==='f')fullscreen();else if(k==='g')dialogView('menu');else if(k==='n')dialogView('notes')});addEventListener('hashchange',fromHash);addEventListener('resize',fit);fit();fromHash();

document.querySelectorAll('.zoomable').forEach(im=>{
 im.tabIndex=0; im.setAttribute('role','button'); im.title='放大原图';
 function zoom(){const img=new Image();img.src=im.currentSrc;img.alt=im.alt;panel.classList.add('lightbox');panel.querySelector('strong').textContent=im.alt;document.querySelector('#detail').replaceChildren(img);panel.showModal();}
 im.onclick=zoom;im.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();zoom()}};
});
panel.addEventListener('close',()=>panel.classList.remove('lightbox'));
</script></body></html>
